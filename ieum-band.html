<!-- ===== 이음중앙관리국 소속 띠 (v1.2.3) =====
  사용법: 사이트의 index.html 맨 아래, body를 닫는 태그 바로 위에 이 블록을 통째로 붙여넣으세요.
  페이지 맨 아래에 "소속: 이음중앙관리국" 띠가 자동으로 생기며, 기존 디자인은 건드리지 않습니다.
  BUREAU_URL 만 이음중앙관리국 사이트의 실제 주소로 바꿔 주세요. -->
<script>
(function(){
  var BUREAU_URL='https://12cchris.github.io/ieum-central-bureau/'; // ← 실제 배포 주소로 수정
  function init(){
    if(document.getElementById('ieumBand'))return;
    var st=document.createElement('style');
    st.textContent=
     '#ieumBand{background:#003366;color:#dbe7f7;font:12px/1.4 "Noto Sans KR",sans-serif;position:relative;z-index:50}'
    +'#ieumBand .in{max-width:1200px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:10px}'
    +'#ieumBand svg{flex:none}'
    +'#ieumBand b{color:#fff;letter-spacing:1px}'
    +'#ieumBand a{margin-left:auto;color:#dbe7f7;text-decoration:none;white-space:nowrap}'
    +'#ieumBand a:hover{color:#fff}'
    +'@media(max-width:520px){#ieumBand .hd{display:none}}';
    document.head.appendChild(st);
    var d=document.createElement('div');
    d.id='ieumBand';
    d.innerHTML='<div class="in">'
     +'<svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><circle cx="24" cy="32" r="15" fill="none" stroke="#ffffff" stroke-width="6"/><circle cx="40" cy="32" r="15" fill="none" stroke="#e52528" stroke-width="6"/></svg>'
     +'<span><span class="hd">소속 · </span><b>이음중앙관리국</b> <span class="hd">(최상위 기관)</span></span>'
     +'<a href="'+BUREAU_URL+'" target="_blank" rel="noopener">상위 기관 누리집 →</a></div>';
    document.body.appendChild(d);
  }
  if(document.body){init()}else{document.addEventListener('DOMContentLoaded',init)}
})();
</script>
